name: Materialize cat artwork

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-cat-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode cat artwork
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode assets/cat-0-sleeping.b64 > assets/cat-0-sleeping.webp
          base64 --decode assets/cat-5-one-eye.b64 > assets/cat-5-one-eye.webp
          base64 --decode assets/cat-10-awake.b64 > assets/cat-10-awake.webp
          base64 --decode assets/cat-15-labcoat.b64 > assets/cat-15-labcoat.webp
          base64 --decode assets/cat-20-glassware.b64 > assets/cat-20-glassware.webp
          base64 --decode assets/cat-25-triumphant.b64 > assets/cat-25-triumphant.webp
          base64 --decode assets/cat-30-fire.b64 > assets/cat-30-fire.webp
          file assets/cat-*.webp

      - name: Commit direct image files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cat-*.webp
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "Add direct cat image assets [skip ci]"
          git push
