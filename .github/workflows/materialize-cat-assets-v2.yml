name: Materialize cat artwork v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-cat-assets-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode and validate cat artwork
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import re
          from pathlib import Path

          stems = [
              "cat-0-sleeping",
              "cat-5-one-eye",
              "cat-10-awake",
              "cat-15-labcoat",
              "cat-20-glassware",
              "cat-25-triumphant",
              "cat-30-fire",
          ]

          for stem in stems:
              src = Path("assets") / f"{stem}.b64"
              dst = Path("assets") / f"{stem}.webp"
              text = src.read_text(encoding="utf-8")
              cleaned = re.sub(r"[^A-Za-z0-9+/=]", "", text)
              cleaned += "=" * ((-len(cleaned)) % 4)
              data = base64.b64decode(cleaned, validate=False)

              if len(data) < 12 or data[:4] != b"RIFF" or data[8:12] != b"WEBP":
                  raise RuntimeError(f"{src} did not decode to a valid WebP")

              dst.write_bytes(data)
              print(f"{dst}: {len(data)} bytes")
          PY

          file assets/cat-*.webp

      - name: Commit direct image files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cat-*.webp
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "Add direct cat image assets [skip ci]"
          git push
