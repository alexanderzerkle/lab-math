name: Remove legacy cat SVG

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-legacy-cat-svg.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove old inline SVG cat renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('script.js')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'scoreEl.textContent = "Score: 0";\nupdateCatGraphic();\nupdateTimerVisibility();',
              'scoreEl.textContent = "Score: 0";\nupdateTimerVisibility();'
          )

          pattern = r'function updateCatGraphic\(\) \{.*?(?=function createAnswerInput\()'
          text, count = re.subn(pattern, '', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one legacy SVG block, removed {count}')

          path.write_text(text, encoding='utf-8')
          PY

          node --check script.js
          ! grep -q 'buildCatSvg' script.js
          ! grep -q 'curledCatSvg' script.js
          ! grep -q 'standingCatSvg' script.js

      - name: Commit cleanup
        run: |
          rm .github/workflows/remove-legacy-cat-svg.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove legacy inline cat SVG renderer [skip ci]"
          git push
