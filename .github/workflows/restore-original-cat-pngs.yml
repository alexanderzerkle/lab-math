name: Restore original cat PNGs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-original-cat-pngs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image decoder
        run: python3 -m pip install --quiet Pillow

      - name: Restore original artwork as PNG
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import io
          import subprocess
          from pathlib import Path
          from PIL import Image

          assets = {
              "cat-0-sleeping": "3a1006a39d50a0af9702146b30d5e147a6d5862c",
              "cat-5-one-eye": "3d02e11378bdb7a1a260240b97a3a6443b4ad381",
              "cat-10-awake": "c06acae6bd51acc48da59213a75d2776ed4fe10b",
              "cat-15-labcoat": "1a48a74dd4ec89e17de23e74b36e17871475545a",
              "cat-20-glassware": "5e2b378344c7e31cd4b4684d699d865d16abed29",
              "cat-25-triumphant": "06169b52160d1bb97e59b63e80a76e9a8428399d",
              "cat-30-fire": "493ca6fe5ae6d6d16cdd7f8ba57d2d024fb4dcf7",
          }

          def historical_text(commit, stem):
              candidates = [
                  f"assets/{stem}.webp.b64",
                  f"assets/{stem}.b64",
              ]
              for path in candidates:
                  result = subprocess.run(
                      ["git", "show", f"{commit}:{path}"],
                      capture_output=True,
                      text=True,
                  )
                  if result.returncode == 0:
                      return result.stdout, path
              raise RuntimeError(f"Could not find historical source for {stem} at {commit}")

          Path("assets").mkdir(exist_ok=True)

          for stem, commit in assets.items():
              encoded, source_path = historical_text(commit, stem)
              cleaned = "".join(encoded.split())
              cleaned += "=" * ((-len(cleaned)) % 4)
              raw = base64.b64decode(cleaned, validate=False)

              with Image.open(io.BytesIO(raw)) as image:
                  image.load()
                  rgba = image.convert("RGBA")
                  output = Path("assets") / f"{stem}.png"
                  rgba.save(output, format="PNG", optimize=True)

              with Image.open(output) as check:
                  check.verify()

              with Image.open(output) as check:
                  print(f"{output}: {check.size[0]}x{check.size[1]} {check.mode} (from {source_path})")
          PY

      - name: Simplify cat renderer and remove obsolete assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          progress = Path("cat-progress.js")
          text = progress.read_text()
          text = text.replace(".webp\"", ".png\"")
          text = text.replace(".webp'", ".png'")
          progress.write_text(text)

          script = Path("script.js")
          text = script.read_text()
          pattern = r"function updateCatGraphic\(\) \{.*?(?=function createAnswerInput\()"
          new_text, count = re.subn(
              pattern,
              "function updateCatGraphic() {\n  // Replaced after script.js loads by cat-progress.js.\n}\n\n",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError(f"Expected to remove one legacy SVG renderer, removed {count}")
          script.write_text(new_text)
          PY

          rm -f assets/*.webp assets/*.b64
          rm -f .github/workflows/materialize-cat-assets.yml
          rm -f .github/workflows/materialize-cat-assets-v2.yml
          rm -f .github/workflows/restore-original-cat-pngs.yml

      - name: Verify final PNG assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          expected = [
              "cat-0-sleeping.png",
              "cat-5-one-eye.png",
              "cat-10-awake.png",
              "cat-15-labcoat.png",
              "cat-20-glassware.png",
              "cat-25-triumphant.png",
              "cat-30-fire.png",
          ]
          for name in expected:
              path = Path("assets") / name
              if not path.exists():
                  raise RuntimeError(f"Missing {path}")
              with Image.open(path) as image:
                  image.load()
                  if image.format != "PNG":
                      raise RuntimeError(f"{path} is not a PNG")
                  print(f"verified {path}: {image.size}")
          PY

          if grep -q '\.webp' cat-progress.js; then
            echo 'cat-progress.js still references WebP' >&2
            exit 1
          fi

      - name: Commit restored PNG assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Restore original cat artwork as PNG assets"
          git push
